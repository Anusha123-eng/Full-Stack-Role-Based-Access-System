spring.application.name=backend
spring.datasource.url=jdbc:mysql://localhost:3306/rbac_db
spring.datasource.username= {DB_USERNAME};
spring.datasource.password={DB_PASSWORD};

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Logging level
logging.level.root=INFO
logging.level.rbac.backend=DEBUG

# Log file location
logging.file.name=logs/combined.log

# Log format
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr(%-5level) %logger{36} - %msg%n

jwt.secret=${JWT_SECRET}